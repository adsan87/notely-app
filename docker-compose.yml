# Run the whole app on your laptop: PostgreSQL + backend + frontend.
#   docker compose up --build      then open http://localhost:5173
services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=notely
      - POSTGRES_PASSWORD=notely-local-only
      - POSTGRES_DB=notely

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_HOST=db
      - DB_USER=notely
      - DB_PASSWORD=notely-local-only
      - DB_NAME=notely
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - PORT=5173
      - API_BASE_URL=http://localhost:3000
    depends_on:
      - backend
