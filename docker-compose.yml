# Run the whole app on your laptop: PostgreSQL + backend + frontend.
#   docker compose up --build      then open http://localhost:5173
# As on Cloud Run since Exercise 5, the browser talks only to the frontend, which forwards /api and
# /health to the backend over the compose network (API_URL). The backend publishes no port.
services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=notely
      - POSTGRES_PASSWORD=notely-local-only
      - POSTGRES_DB=notely
    # The backend creates its table at start-up, so it waits until PostgreSQL accepts connections
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notely -d notely"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    environment:
      - PORT=3000
      - DB_HOST=db
      - DB_USER=notely
      - DB_PASSWORD=notely-local-only
      - DB_NAME=notely
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:8080"
    environment:
      - PORT=8080
      - API_URL=http://backend:3000
    depends_on:
      - backend
